[project]
name = "agentic-rag"
version = "0.2.0"
description = "Agentic RAG - mixed corpus (docs + web + code) with citations, production-hardened"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "chainlit>=2.12.0",
    "fastembed>=0.9.1",
    "lancedb>=0.41.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openai>=3.51.0",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.3",
    "pymupdf4llm>=2.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "tavily-python>=0.8.5",
    "tiktoken>=0.14.0",
    "tree-sitter-language-pack>=1.25.2",
    "youtube-transcript-api>=1.2.5",
]

[project.scripts]
rag-buddy = "app.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
